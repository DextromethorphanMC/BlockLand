plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = 'com.blockland'

base {
    archivesName = 'blockland'
}

// Mojang ships Java 21 to end users in 1.20.5+
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// one Mixin config per area of vanilla it changes (client/perf, rendering spec §20; server/anticheat, anti-cheat spec §2)
ext.MIXIN_CONFIGS = ['blockland.mixins.json', 'blockland.gl.mixins.json', 'blockland.terrain.mixins.json',
                     'blockland.particles.mixins.json', 'blockland.anticheat.mixins.json', 'blockland.display.mixins.json',
                     'blockland.level.mixins.json', 'blockland.farterrain.mixins.json', 'blockland.inventory.mixins.json',
                     'blockland.hud.mixins.json', 'blockland.chat.mixins.json']

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            // the jar names them in its manifest (MixinConfigs); dev runs load the classes from folders
            MIXIN_CONFIGS.each { args '--mixin.config', it }
        }

        register('client') {
            // a second local client needs its own game directory: -PclientDir=run2 -PdevName=Alex
            workingDir = layout.projectDirectory.dir(project.findProperty('clientDir') ?: 'run')
            // .\build.ps1 runClient -PjoinServer=localhost:25565  -> joins the dev server directly
            if (project.hasProperty('joinServer')) {
                args '--quickPlayMultiplayer', project.property('joinServer')
            }
            if (project.hasProperty('devName')) {
                args '--username', project.property('devName')
            }
            // dev-only test driver (see client/dev/DevAutomation): -Pautomation=<dir>
            if (project.hasProperty('automation')) {
                systemProperty 'blockland.automation', project.property('automation')
            }
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Two jars, each without the other side's half, so neither ships what it never runs:
//  - blockland-<ver>-client.jar, for players: no server half — game logic (server/, games/), the server's mixins and the
//    data only the server reads — so there is no server to decompile;
//  - blockland-<ver>-server.jar, for dedicated servers: no client half — client/, the client-only mixins and the client's
//    resources (textures, models, shaders, sounds, fonts, built-in resource packs); only the language files stay, which
//    Forge loads on a dedicated server for Language lookups.
// Shared code (items, entities, network, catalogs, synced registries, tags, loot tables) is in both. Neither half may be
// named outside itself except where that side alone runs it: BlockLand loads the server half by name and starts the
// client half under a Dist check, and client item extensions (GunItem, BinocularsItem) are only called on a client.
// checkClientJar / checkServerJar fail the build when a class in a jar names something stripped from it.
ext.SERVER_ONLY_CLASSES = ['com/blockland/server/', 'com/blockland/games/',
                           'com/blockland/mixin/anticheat/', 'com/blockland/mixin/farterrain/']
ext.SERVER_ONLY_MIXIN_CONFIGS = ['blockland.anticheat.mixins.json', 'blockland.farterrain.mixins.json']
ext.SERVER_ONLY_DATA = ['data/blockland/anticheat/', 'data/blockland/infection/', 'data/blockland/farterrain/',
                        'data/blockland/combat/projectile_hits.json']
// a package ends in '/'; anything else is one class (with its nested classes) out of a mixed mixin package
ext.CLIENT_ONLY_CLASSES = ['com/blockland/client/', 'com/blockland/mixin/core/', 'com/blockland/mixin/gl/',
                           'com/blockland/mixin/terrain/', 'com/blockland/mixin/particles/', 'com/blockland/mixin/display/',
                           'com/blockland/mixin/level/', 'com/blockland/mixin/hud/', 'com/blockland/mixin/chat/',
                           'com/blockland/mixin/inventory/ContainerScreenAccess', 'com/blockland/mixin/inventory/CreativeGridMixin',
                           'com/blockland/mixin/inventory/CreativeScreenAccess', 'com/blockland/mixin/inventory/ItemPickerMenuMixin']
ext.CLIENT_ONLY_MIXIN_CONFIGS = ['blockland.mixins.json', 'blockland.gl.mixins.json', 'blockland.terrain.mixins.json',
                                 'blockland.particles.mixins.json', 'blockland.display.mixins.json', 'blockland.level.mixins.json',
                                 'blockland.hud.mixins.json', 'blockland.chat.mixins.json']
ext.CLIENT_ONLY_RESOURCES = ['resourcepacks/']

/** Exclude patterns for stripped names: a package or folder (trailing '/'), a class and its nested classes, or a file. */
static List<String> excludePatterns(List<String> names) {
    names.collectMany { String name ->
        if (name.endsWith('/')) return [name + '**']
        if (name.startsWith('com/') && !name.contains('.')) return [name + '.class', name + '$*.class']
        return [name]
    }
}

// official names at runtime, so no refmap
tasks.named('jar', Jar) {
    description = 'The mod without its client half, for dedicated servers (blockland-<ver>-server.jar).'
    archiveClassifier = 'server'
    includeEmptyDirs = false
    exclude excludePatterns(CLIENT_ONLY_CLASSES + CLIENT_ONLY_RESOURCES)
    exclude CLIENT_ONLY_MIXIN_CONFIGS
    // the client's assets, all but the language files (assets/<namespace>/lang/)
    exclude { FileTreeElement e -> !e.directory && e.path.startsWith('assets/') && !(e.path ==~ /assets\/[^\/]+\/lang\/.+/) }
    manifest {
        attributes('MixinConfigs': (MIXIN_CONFIGS - CLIENT_ONLY_MIXIN_CONFIGS).join(','))
    }
}

def clientJar = tasks.register('clientJar', Jar) {
    group = 'build'
    description = 'The mod without its server half, for players (blockland-<ver>-client.jar).'
    archiveClassifier = 'client'
    from sourceSets.main.output
    exclude excludePatterns(SERVER_ONLY_CLASSES + SERVER_ONLY_DATA)
    exclude SERVER_ONLY_MIXIN_CONFIGS
    manifest {
        attributes('MixinConfigs': (MIXIN_CONFIGS - SERVER_ONLY_MIXIN_CONFIGS).join(','))
    }
}

/**
 * Fails when a side's jar would break or leak: a stripped path is in it, a class in it names a stripped class or file (in
 * its constant pool, so imports, reflection strings and mixin targets alike), or its manifest names a mixin config, or a
 * mixin that side applies, that is not in it.
 */
abstract class CheckSideJar extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJar()

    /** 'client' or 'server': which of a mixin config's lists (besides 'mixins') this side applies. */
    @Input
    abstract Property<String> getSide()

    /** Names the jar must not mention, in both the internal (a/b/) and the dotted (a.b.) form; see excludePatterns. */
    @Input
    abstract ListProperty<String> getStripped()

    /** Entry → the one stripped class it may name, in either form (only reached on the side that has it). */
    @Input
    abstract MapProperty<String, String> getAllowed()

    @OutputFile
    abstract RegularFileProperty getReport()

    @TaskAction
    void check() {
        def needles = stripped.get().collectMany { [it, it.replace('/', '.')] }.unique()
        def problems = []
        int classes = 0
        new java.util.jar.JarFile(jar.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory) return
                if (needles.any { entry.name.startsWith(it) }) problems << "${entry.name}: stripped path is in the jar"
                if (!entry.name.endsWith('.class')) return
                classes++
                // constant-pool names are (modified) UTF-8: ASCII names appear byte for byte
                String text = zip.getInputStream(entry).withCloseable { new String(it.bytes, 'ISO-8859-1') }
                String exempt = allowed.get()[entry.name]
                if (exempt) text = text.replace(exempt, '').replace(exempt.replace('/', '.'), '')
                needles.findAll { text.contains(it) }.each { problems << "${entry.name} refers to ${it}" }
            }
            String configs = zip.manifest?.mainAttributes?.getValue('MixinConfigs') ?: ''
            configs.split(',').findAll { it }.each { name ->
                def config = zip.getEntry(name)
                if (config == null) { problems << "manifest names mixin config ${name}, not in the jar"; return }
                def json = zip.getInputStream(config).withCloseable { new groovy.json.JsonSlurper().parse(it, 'UTF-8') }
                ((json.mixins ?: []) + (json[side.get()] ?: [])).each { mixin ->
                    String path = "${json.package}.${mixin}".replace('.', '/') + '.class'
                    if (zip.getEntry(path) == null) problems << "${name} lists ${mixin}, not in the jar"
                }
            }
        }
        if (problems) throw new GradleException("${side.get().capitalize()} jar ${jar.get().asFile.name} is not "
                + "self-contained:\n  " + problems.unique().join('\n  '))
        report.get().asFile.text = "${classes} classes checked, nothing stripped is named\n"
    }
}

def checkClientJar = tasks.register('checkClientJar', CheckSideJar) {
    group = 'verification'
    description = 'Checks that the client jar neither contains nor refers to the server half.'
    jar = clientJar.flatMap { it.archiveFile }
    side = 'client'
    stripped = SERVER_ONLY_CLASSES + SERVER_ONLY_DATA
    allowed = ['com/blockland/BlockLand.class': 'com/blockland/server/BlockLandServer']
    report = layout.buildDirectory.file('reports/checkClientJar.txt')
}

def checkServerJar = tasks.register('checkServerJar', CheckSideJar) {
    group = 'verification'
    description = 'Checks that the server jar neither contains nor refers to the client half.'
    jar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    side = 'server'
    stripped = CLIENT_ONLY_CLASSES + CLIENT_ONLY_RESOURCES
    allowed = ['com/blockland/BlockLand.class'          : 'com/blockland/client/BlockLandClient',
               'com/blockland/gun/GunItem$1.class'       : 'com/blockland/client/gun/DualHold',
               'com/blockland/binoculars/BinocularsItem$1.class': 'com/blockland/client/binoculars/ClientBinoculars']
    report = layout.buildDirectory.file('reports/checkServerJar.txt')
}

tasks.named('assemble') { dependsOn clientJar, checkClientJar, checkServerJar }
tasks.named('check') { dependsOn checkClientJar, checkServerJar }

tasks.named('processResources', ProcessResources) {
    def props = [mod_version: mod_version, minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties(props)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(props)
    }
}
